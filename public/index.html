<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card-header">
      <h1>BMI Calculator</h1>
      <p class="intro">Enter your weight and height to see your BMI and body category instantly.</p>
    </div>

    <form id="bmi-form">
      <div class="field-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" step="0.1" min="0" placeholder="e.g. 70" required />
      </div>

      <div class="field-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" step="0.1" min="0" placeholder="e.g. 175" required />
      </div>

      <button type="submit">Calculate BMI</button>
    </form>

    <div id="result" class="result">
      <p class="result-text">Your BMI will appear here.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
